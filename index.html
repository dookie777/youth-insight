<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Youth Football Insight Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange:        #e9b45e;
    --orange-dim:    rgba(233,180,94,0.12);
    --orange-line:   rgba(233,180,94,0.4);
    --bg:            #0a0a0a;
    --bg-panel:      #0e0e0e;
    --bg-card:       #141414;
    --bg-hover:      #1c1c1c;
    --bg-input:      #171717;
    --text:          #f2f2f2;
    --text-2:        #cfcfcf;
    --text-3:        #8d8d8d;
    --border:        rgba(255,255,255,0.08);
    --border-2:      rgba(255,255,255,0.18);
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    --disp: 'Bebas Neue', sans-serif;
    --body: 'Noto Sans KR', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --hd: 58px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, rgba(255,255,255,0.03) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(255,165,0,0.025) 0%, transparent 45%);
    color: var(--text);
    font-family: var(--body);
    word-break: keep-all; overflow-wrap: break-word;
    min-height: 100vh; line-height: 1.7;
  }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== 헤더 ===== */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hd);
    background: rgba(10,10,10,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    padding: 0 clamp(14px, 2.5vw, 28px);
  }
  .menu-btn {
    display: none; background: none; border: 1px solid var(--border-2);
    border-radius: var(--r-sm); color: var(--text-2); font-size: 1rem;
    width: 34px; height: 34px; cursor: pointer; line-height: 1;
  }
  .brand-logo { height: 26px; width: auto; display: block; flex-shrink: 0; }
  .hd-div { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .tool-name {
    font-family: var(--disp); font-size: 1.12rem; letter-spacing: 3px;
    color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .hd-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .live-dot {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.5px; color: var(--text-3);
    white-space: nowrap;
  }
  .live-dot::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--orange); animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .live-dot b { color: var(--text-2); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { .live-dot::before { animation: none; } }

  /* ===== 레이아웃 ===== */
  .layout { display: grid; grid-template-columns: 288px minmax(0, 1fr); padding-top: var(--hd); }

  /* ===== 사이드바: 디렉토리 트리 ===== */
  .sidebar {
    position: sticky; top: var(--hd);
    height: calc(100vh - var(--hd));
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 20px 12px 32px;
  }
  .side-title {
    font-family: var(--disp); font-size: 0.92rem; letter-spacing: 2.5px;
    color: var(--text-3); padding: 0 10px 10px;
  }
  .tree-root {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: var(--r-md); cursor: pointer;
    font-size: 0.85rem; color: var(--text-2); transition: background .12s ease;
  }
  .tree-root:hover { background: var(--bg-hover); }
  .tree-root.active { color: var(--orange); background: var(--orange-dim); }
  .tree-root .cnt { margin-left: auto; }
  .cnt {
    font-family: var(--mono); font-size: 0.66rem; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 99px; padding: 1px 7px;
  }
  .tree-cat { margin-top: 2px; }
  .tree-cat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: var(--r-md); cursor: pointer;
    font-size: 0.85rem; color: var(--text-2);
    transition: background .12s ease, color .12s ease;
  }
  .tree-cat-head:hover { background: var(--bg-hover); color: var(--text); }
  .tree-cat.active > .tree-cat-head { color: var(--orange); background: var(--orange-dim); }
  .tree-num { font-family: var(--mono); font-size: 0.68rem; color: var(--text-3); }
  .tree-cat.active > .tree-cat-head .tree-num { color: var(--orange); }
  .tree-cat-head .cnt { margin-left: auto; }
  .tree-caret { font-size: 0.6rem; color: var(--text-3); transition: transform .15s ease; }
  .tree-cat.open > .tree-cat-head .tree-caret { transform: rotate(90deg); }
  .tree-items { display: none; margin: 2px 0 6px 15px; border-left: 1px solid var(--border); }
  .tree-cat.open > .tree-items { display: block; }
  .tree-sub { margin: 2px 0; }
  .tree-sub-head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px 6px 12px; cursor: pointer;
    font-size: 0.76rem; color: var(--text-3);
  }
  .tree-sub-head:hover { color: var(--text-2); }
  .tree-leaf {
    display: block; padding: 6px 10px 6px 12px; cursor: pointer;
    font-size: 0.78rem; color: var(--text-3); line-height: 1.5;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    transition: color .12s ease, background .12s ease;
    position: relative;
  }
  .tree-leaf::before {
    content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 1px;
    background: var(--border-2);
  }
  .tree-leaf:hover { color: var(--text); background: var(--bg-hover); }
  .tree-leaf .leaf-new {
    font-family: var(--mono); font-size: 0.6rem; color: var(--orange); margin-left: 5px;
  }
  .tree-head-new { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 1px; color: var(--orange); }
  .tree-more {
    display: block; padding: 7px 10px 7px 12px; cursor: pointer;
    font-size: 0.73rem; color: var(--orange); position: relative;
  }
  .tree-more::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 1px; background: var(--border-2); }
  .tree-more:hover { text-decoration: underline; }
  .drawer-bg { display: none; }

  /* ===== 메인 ===== */
  .main { min-width: 0; }
  .hero-zone { padding: clamp(20px, 3vw, 32px) clamp(16px, 3.5vw, 48px) 0; }
  .scroll-pane { padding: 0 clamp(16px, 3.5vw, 48px); }
  .zone-inner, .pane-inner { max-width: 1360px; margin: 0 auto; width: 100%; }
  .pane-inner { padding: 8px 0 26px; display: flex; flex-direction: column; min-height: 100%; }
  @media (min-width: 921px) {
    body { overflow: hidden; }
    .layout { height: 100vh; }
    .main { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .hero-zone { flex-shrink: 0; }
    .scroll-pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  }
  @media (min-width: 1800px) {
    .layout { grid-template-columns: 320px minmax(0, 1fr); }
    .zone-inner, .pane-inner { max-width: 1560px; }
  }
  .cat-band {
    display: none; align-items: center; gap: 10px;
    margin-top: 14px; padding: 10px 16px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-md); position: relative; overflow: hidden;
  }
  .cat-band::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--orange); }
  .cat-band-num { font-family: var(--mono); font-size: 0.74rem; color: var(--orange); }
  .cat-band-label { font-size: 0.96rem; font-weight: 700; }
  .cat-band-clear {
    margin-left: auto; background: none; border: 1px solid var(--border-2); border-radius: 99px;
    color: var(--text-2); font-size: 0.72rem; padding: 5px 13px; cursor: pointer;
    font-family: var(--body); transition: all .15s ease; white-space: nowrap;
  }
  .cat-band-clear:hover { border-color: var(--text-3); color: var(--text); }

  .hero { padding-bottom: clamp(18px, 3vw, 30px); }
  .hero-title {
    font-family: var(--disp);
    font-size: clamp(2.3rem, 6vw, 3.6rem);
    letter-spacing: 3px; line-height: 1;
  }
  .hero-title em { font-style: normal; color: var(--orange); }
  .hero-sub { margin-top: 8px; font-size: 0.85rem; color: var(--text-3); }
  .hero-sub b { color: var(--text-2); font-weight: 500; }
  .hero-rule { margin-top: 18px; height: 2px; background: linear-gradient(90deg, var(--orange) 0 110px, var(--border) 110px 100%); }

  .section { padding: clamp(16px, 2.5vw, 26px) 0; }
  .sec-label {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
  }
  .sec-label .en { font-family: var(--disp); font-size: 1.02rem; letter-spacing: 3px; color: var(--orange); }
  .sec-label .ko { font-size: 0.98rem; font-weight: 700; }
  .sec-label small { font-size: 0.76rem; font-weight: 400; color: var(--text-3); }

  /* ===== 뱃지 ===== */
  .badge {
    display: inline-block; font-size: 0.67rem; font-weight: 500; letter-spacing: 0.4px;
    padding: 2px 9px; border-radius: 99px; border: 1px solid var(--border-2);
    color: var(--text-2); white-space: nowrap;
  }
  .badge-new { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
  .badge-paper  { border-color: rgba(120,180,255,0.5); color: #9cc4ff; }
  .badge-report { border-color: rgba(120,230,170,0.5); color: #8fe6b4; }
  .badge-news   { border-color: rgba(255,190,120,0.5); color: #ffce96; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--body); font-size: 0.78rem; font-weight: 500;
    padding: 7px 15px; border-radius: var(--r-md); cursor: pointer;
    text-decoration: none; border: 1px solid var(--border-2);
    color: var(--text); background: transparent; transition: all .15s ease;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--text-3); }
  .btn-primary { background: var(--orange); border-color: var(--orange); color: #141414; font-weight: 700; }
  .btn-primary:hover { background: #f2c77e; border-color: #f2c77e; }

  /* ===== 최근 업데이트 레일 ===== */
  .recent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1500px) { .recent-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .recent-grid { grid-template-columns: 1fr; } }
  .recent-card {
    position: relative;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 18px 20px;
    display: flex; flex-direction: column; gap: 11px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
    overflow: hidden;
  }
  .recent-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--orange-line);
  }
  .recent-card:hover { border-color: var(--border-2); background: var(--bg-hover); transform: translateY(-2px); }
  .recent-meta {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 0.64rem; color: var(--text-3); letter-spacing: 0.5px;
  }
  .recent-meta b { color: var(--orange); font-weight: 500; }
  .recent-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .recent-ko { font-size: 0.97rem; font-weight: 700; line-height: 1.5; }
  .recent-summary {
    font-size: 0.8rem; color: var(--text-2); line-height: 1.75;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .recent-src { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--text-3); }
  .recent-src b { color: var(--text-2); font-weight: 500; }

  /* ===== 아카이브 ===== */
  .controls { display: flex; flex-direction: column; gap: 11px; margin-bottom: 14px; }
  .search-field {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--r-md); color: var(--text);
    font-family: var(--body); font-size: 0.87rem; padding: 11px 16px;
    outline: none; transition: border-color .15s ease;
  }
  .search-field::placeholder { color: var(--text-3); }
  .search-field:focus { border-color: var(--orange); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 0.76rem; padding: 6px 13px; border-radius: 99px;
    border: 1px solid var(--border-2); color: var(--text-2);
    background: transparent; cursor: pointer; font-family: var(--body);
    transition: all .15s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--text-3); color: var(--text); }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #141414; font-weight: 700; }
  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 0.76rem; color: var(--text-3); }
  .meta-row b { color: var(--orange); font-weight: 700; }

  .rowlist { border-top: 1px solid var(--border); }
  .row { border-bottom: 1px solid var(--border); transition: background .12s ease; }
  .row:hover { background: var(--bg-hover); }
  .row.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0% { background: var(--orange-dim); } 100% { background: transparent; } }
  .row-head {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px;
    padding: 13px 10px; align-items: center; cursor: pointer;
  }
  .row-idx { display: none; }
  .row-ko { font-size: 0.93rem; font-weight: 500; line-height: 1.5; }
  .row-date { font-family: var(--mono); font-size: 0.64rem; color: var(--text-3); margin-top: 2px; }
  .row-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-self: end; }
  .row-caret { color: var(--text-3); font-size: 0.65rem; transition: transform .15s ease; margin-left: 4px; }
  .row.open .row-caret { transform: rotate(180deg); }
  .row-detail { display: none; padding: 2px 10px 20px; }
  .row.open .row-detail { display: block; }
  .row-en { font-size: 0.77rem; color: var(--text-3); line-height: 1.55; margin-bottom: 10px; }
  .row-summary { font-size: 0.87rem; color: var(--text-2); line-height: 1.85; max-width: 66em; }
  .row-bottom { margin-top: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .row-src { font-size: 0.75rem; color: var(--text-3); margin-right: auto; }
  .row-src b { color: var(--text-2); font-weight: 500; }
  .empty { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 0.85rem; }

  .footer {
    margin-top: auto; border-top: 1px solid var(--border); padding: 26px 0 6px;
    display: flex; justify-content: center;
  }
  .archive { padding-bottom: 46px; }
  .footer-line {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 1.5px; color: var(--text-3);
  }

  /* ===== 모바일 ===== */
  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .menu-btn { display: block; }
    .sidebar {
      position: fixed; top: var(--hd); left: 0; bottom: 0; width: min(310px, 84vw);
      transform: translateX(-102%); transition: transform .22s ease; z-index: 150;
      box-shadow: 12px 0 40px rgba(0,0,0,0.6);
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-bg.show {
      display: block; position: fixed; inset: var(--hd) 0 0 0;
      background: rgba(0,0,0,0.55); z-index: 140;
    }
    .tool-name { font-size: 0.95rem; letter-spacing: 2px; }
    .hd-div { display: none; }
    .row-head { grid-template-columns: 1fr; }
    .row-tags { justify-self: start; }
  }
</style>
</head>

DATA.forEach((d, i) => d._id = i);
const parseD = s => { const m = String(s).match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
let baseDate = parseD(SITE.lastUpdate) || new Date();
const isRecent = d => {
  const a = parseD(d.added);
  return a && (baseDate - a) / 86400000 <= SITE.recentDays;
};

let activeType = "all";

const catLabel = k => { const c = CATEGORIES.find(x => x.key === k); return c ? c.label : k; };

  ${isRecent(d) ? '<span class="badge badge-new">NEW</span>' : ""}

  <span class="badge ${TYPE_CLASS[d.type]}">${TYPE_LABEL[d.type]}</span>`;

};

    let inner = "";
    if (subs.length) {
      inner += subs.map(s => {
        const si = items.filter(d => d.sub === s);
        return `
        <div class="tree-sub">
          <div class="tree-sub-head">└ ${esc(s)}</div>
          ${si.slice(0, MAX_LEAF).map(leaf).join("")}
        </div>`;
      }).join("");
      inner += items.filter(d => !d.sub).slice(0, MAX_LEAF).map(leaf).join("");
    } else {
      inner = items.slice(0, MAX_LEAF).map(leaf).join("");
    }
    if (items.length > MAX_LEAF) {
      inner += `<span class="tree-more" data-more="${c.key}">전체 ${items.length}건 보기 →</span>`;
    }
    return `
      <div class="tree-cat${activeCat === c.key ? " active open" : ""}" data-cat="${c.key}">
        <div class="tree-cat-head">
          <span class="tree-caret">▶</span>
          <span class="tree-num">${catNum(c.key)}</span>
          <span>${esc(c.label)}</span>
          ${hasNew ? '<span class="tree-head-new">NEW</span>' : ""}
          <span class="cnt">${items.length}</span>
        </div>
        <div class="tree-items">${inner}</div>
      </div>`;
  }).join("");
  tree.innerHTML = rootRow + cats;

  tree.querySelector("[data-root]").onclick = () => { setCat("all"); closeDrawer(); };
  tree.querySelectorAll(".tree-cat").forEach(el => {
    el.querySelector(".tree-cat-head").onclick = () => {
      const key = el.dataset.cat;
      if (activeCat === key) { el.classList.toggle("open"); return; }
      el.classList.add("open");
      setCat(key);
    };
  });
  tree.querySelectorAll(".tree-more").forEach(el => {
    el.onclick = e => { e.stopPropagation(); setCat(el.dataset.more); closeDrawer(); };
  });
  tree.querySelectorAll(".tree-leaf").forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      goToItem(+el.dataset.id);
      closeDrawer();
    };
  });
}
function leaf(d) {
  return `<span class="tree-leaf" data-id="${d._id}">${esc(d.ko)}${isRecent(d) ? '<span class="leaf-new">NEW</span>' : ""}</span>`;
}

/* ----- 최근 업데이트 ----- */
function renderRecent() {
  const sec = document.getElementById("recentSection");
  const pool = activeCat === "all" ? DATA : DATA.filter(d => d.cat === activeCat);
  let list = pool.filter(isRecent).slice().reverse();
  let fallback = false;
  if (activeCat !== "all" && !list.length) {
    list = pool.slice().reverse().slice(0, 3);
    fallback = true;
  }
  if (!list.length) { sec.style.display = "none"; return; }
  sec.style.display = "";
  document.getElementById("recentInfo").textContent = fallback
    ? `최근 ${SITE.recentDays}일 신규 없음 · 최신 등록 ${list.length}건`
    : `최근 ${SITE.recentDays}일 · ${list.length}건`;
  document.getElementById("recentGrid").innerHTML = list.map(d => `
    <div class="recent-card" data-goto="${d._id}">
      <div class="recent-meta">${d.added ? `ADDED <b>${esc(d.added)}</b>` : `<b>${esc(d.date)}</b>`}</div>
      <div class="recent-tags">${badges(d)}</div>
      <div class="recent-ko">${esc(d.ko)}</div>
      <div class="recent-summary">${esc(d.summary)}</div>
      <div class="recent-src"><b>${esc(d.source)}</b> · ${esc(d.date)}</div>
    </div>`).join("");
  document.querySelectorAll("[data-goto]").forEach(el => {
    el.onclick = () => goToItem(+el.dataset.goto);
  });
}

function renderCatBand() {
  const band = document.getElementById("catBand");
  if (activeCat === "all") { band.style.display = "none"; return; }
  band.style.display = "flex";
  document.getElementById("catBandNum").textContent = catNum(activeCat);
  document.getElementById("catBandLabel").textContent = catLabel(activeCat);
  document.getElementById("catBandCnt").textContent = DATA.filter(d => d.cat === activeCat).length;
}

/* ----- 아카이브 ----- */
function renderArchive() {
  const kw = keyword.trim().toLowerCase();
  const list = DATA.slice().reverse().filter(d =>
    (activeCat === "all" || d.cat === activeCat) &&
    (activeType === "all" || d.type === activeType) &&
    (!kw || (d.en + " " + d.ko + " " + d.summary + " " + d.source + " " + d.cat + " " + (d.sub || "")).toLowerCase().includes(kw))
  );
  document.getElementById("archiveCount").textContent = `누적 ${DATA.length}건`;
  document.getElementById("resultMeta").innerHTML = `<b>${list.length}</b>건 표시 중`;
  document.getElementById("emptyState").style.display = list.length ? "none" : "block";

  document.getElementById("archiveList").innerHTML = list.map(d => `
    <div class="row" id="row-${d._id}">
      <div class="row-head">
        <div>
          <div class="row-ko">${esc(d.ko)}</div>
          ${d.added ? `<div class="row-date">ADDED ${esc(d.added)}</div>` : ""}
        </div>
        <div class="row-tags">${badges(d)}<span class="row-caret">▼</span></div>
      </div>
      <div class="row-detail">
        <div class="row-en">${esc(d.en)}</div>
        <div class="row-summary">${esc(d.summary)}</div>
        <div class="row-bottom">
          <div class="row-src"><b>${esc(d.source)}</b> · ${esc(d.date)}${d.sub ? ` · ${esc(d.sub)}` : ""}</div>
          ${actionBtns(d)}
        </div>
      </div>
    </div>`).join("");

  document.querySelectorAll(".row").forEach(r => {
    r.querySelector(".row-head").onclick = () => r.classList.toggle("open");
  });
}

/* ----- 내비게이션 ----- */
function setCat(key) {
  activeCat = key;
  document.querySelectorAll(".tree-cat").forEach(el =>
    el.classList.toggle("active", el.dataset.cat === key));
  document.querySelector("[data-root]").classList.toggle("active", key === "all");
  renderCatBand();
  renderRecent();
  renderArchive();
  document.getElementById("scrollPane").scrollTop = 0;
  window.scrollTo({ top: 0 });
}
function goToItem(id) {
  const d = DATA[id];
  if (activeCat !== "all" && activeCat !== d.cat) { activeCat = d.cat; }
  activeType = "all"; keyword = "";
  document.getElementById("searchInput").value = "";
  document.querySelectorAll("#typeChips .chip").forEach(x => x.classList.toggle("active", x.dataset.type === "all"));
  document.querySelectorAll(".tree-cat").forEach(el =>
    el.classList.toggle("active", el.dataset.cat === activeCat));
  document.querySelector("[data-root]").classList.toggle("active", activeCat === "all");
  renderCatBand();
  renderRecent();
  renderArchive();
  const row = document.getElementById("row-" + id);
  if (row) {
    row.classList.add("open", "flash");
    row.scrollIntoView({ block: "center" });
    setTimeout(() => row.classList.remove("flash"), 1700);
  }
}
document.getElementById("catBandClear").onclick = () => setCat("all");

document.getElementById("searchInput").addEventListener("input", e => { keyword = e.target.value; renderArchive(); });
document.querySelectorAll("#typeChips .chip").forEach(b => {
  b.onclick = () => {
    activeType = b.dataset.type;
    document.querySelectorAll("#typeChips .chip").forEach(x => x.classList.toggle("active", x === b));
    renderArchive();
  };
});

/* ----- 모바일 드로어 ----- */
const sidebar = document.getElementById("sidebar");
const drawerBg = document.getElementById("drawerBg");
function closeDrawer() { sidebar.classList.remove("open"); drawerBg.classList.remove("show"); }
document.getElementById("menuBtn").onclick = () => {
  sidebar.classList.toggle("open");
  drawerBg.classList.toggle("show", sidebar.classList.contains("open"));
};
drawerBg.onclick = closeDrawer;

function rerenderAll() {
  renderTop();
  renderTree();
  renderCatBand();
  renderRecent();
  renderArchive();
}

/* data.json(예약 갱신 스냅샷) 로드 — 실패 시 내장 데이터로 표시 유지 */
async function loadRemoteData() {
  try {
    const r = await fetch("data.json?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (!Array.isArray(j.items) || j.items.length < 5) return;
    DATA.length = 0;
    j.items.forEach((d, i) => { d._id = i; DATA.push(d); });
    if (j.lastUpdate) SITE.lastUpdate = j.lastUpdate;
    baseDate = parseD(SITE.lastUpdate) || new Date();
    activeCat = "all"; activeType = "all"; keyword = "";
    const si = document.getElementById("searchInput");
    si.value = "";
    document.querySelectorAll("#typeChips .chip").forEach(x => x.classList.toggle("active", x.dataset.type === "all"));
    rerenderAll();
  } catch (e) { /* 통신 실패 시 내장 데이터 유지 */ }
}

rerenderAll();
loadRemoteData();
</script>
