# 실행 시각: 매주 월·목 02:00 KST (= 일·수 17:00 UTC)
# 시각 변경 시 아래 cron 한 줄만 수정 (분 시 일 월 요일, UTC 기준, 요일 0=일요일)
name: Update data from master sheet

on:
  schedule:
    - cron: "0 17 * * 0,3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sheet and build data.json
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "eroom-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: auto-update data ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
          git push
